[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-just-to-code-fastapi"
version = "0.1.0"
description = "FastAPI port of the just_to_code REST API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "peewee>=3.17,<4",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
